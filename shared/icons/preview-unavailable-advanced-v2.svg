  <!-- Film sprocket dividers -->
  <path d="M7.5 3V21M24.5 3V21"
        stroke="currentColor" stroke-width="2"/>

  <!-- Left sprocket holes -->
  <rect x="3.8" y="5" width="2.4" height="3.2" rx="0.5" fill="currentColor"/>
  <rect x="3.8" y="10.4" width="2.4" height="3.2" rx="0.5" fill="currentColor"/>
  <rect x="3.8" y="15.8" width="2.4" height="3.2" rx="0.5" fill="currentColor"/>

  <!-- Right sprocket holes -->
  <rect x="25.8" y="5" width="2.4" height="3.2" rx="0.5" fill="currentColor"/>
  <rect x="25.8" y="10.4" width="2.4" height="3.2" rx="0.5" fill="currentColor"/>
  <rect x="25.8" y="15.8" width="2.4" height="3.2" rx="0.5" fill="currentColor"/>

