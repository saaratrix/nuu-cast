[package]
name = "nuuwatch"
version = "0.1.0"
description = "A centralised way to view what exists using for example MAL."
edition = "2024"
publish = false

[dependencies]
axum= { version="0.8.8", features = ["http2", "tokio", "macros"] }
tokio={ version = "1.49.0", features = ["full"] }
hyper="1.8.1"
tower-http = { version = "0.6.8", features = ["fs"] }
tokio-util = "0.7.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
reqwest = {  version= "0.13.2", features = ["json", "blocking"] }
url = "2.5.8"
sqlx = { version="0.9.0", features =["sqlite", "runtime-tokio"] }
scraper = "0.27.0"
regex = "1.13.1"
nuufetch = { path = "../nuufetch" }
tokio-stream = "0.1.18"
local-ip-address = "0.6.13"